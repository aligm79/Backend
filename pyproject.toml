[project]
name = "dmp-backend"
version = "0.1.0"
description = "Data Marketplace + Study-Abroad Applications backend (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.17",   # for UploadFile (application documents)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # function calls in defaults are the idiomatic FastAPI pattern (Depends/Header/File/Form)
    "SIM102",  # nested-if collapsing is often less readable than the explicit form
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "UP", "B", "SIM"]  # generated-style migration code

[tool.pytest.ini_options]
asyncio_mode = "auto"
